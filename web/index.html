<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>review-master</title>
  <link rel="stylesheet" href="/vendor/highlight.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">review-master</div>
    <div class="pr-info">
      <div id="pr-title" class="pr-title">Loading…</div>
      <div id="pr-meta" class="pr-meta"></div>
    </div>
    <div class="top-actions">
      <span id="engine-chip" class="chip engine" title="Review engine"></span>
      <button id="btn-help" class="btn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button id="btn-chat" class="btn" type="button" title="Chat (c)">Chat</button>
      <button id="btn-findings" class="btn" type="button" title="LLM findings (f)">Findings <span id="findings-badge" class="count-badge" hidden>0</span></button>
      <button id="btn-review" class="btn primary" type="button" title="Review drawer (r)">Review <span id="draft-count" class="count-badge" hidden>0</span></button>
    </div>
  </header>

  <div id="banner" hidden></div>

  <div id="layout">
    <nav id="sidebar" aria-label="Changed files">
      <div class="side-head">
        <span class="side-title">Files changed</span>
        <span id="file-summary" class="dim"></span>
        <input id="file-filter" class="side-filter" type="search" placeholder="Filter files…  ( / )" aria-label="Filter files" autocomplete="off" spellcheck="false">
        <label id="test-toggle" class="pill-toggle" title="Exclude test files from the review (drafts on them won't be submitted)" hidden>
          <input id="hide-tests" type="checkbox"> <span id="test-count"></span>
        </label>
        <label id="remote-toggle" class="pill-toggle" title="Show the review comments already on this pull request" hidden>
          <input id="show-remote" type="checkbox"> <span id="remote-count"></span>
        </label>
        <button id="remote-retry" class="link-btn" type="button" hidden>PR comments failed · retry</button>
        <label id="findings-toggle" class="pill-toggle" title="Show the imported LLM findings on the code" hidden>
          <input id="show-findings" type="checkbox"> <span id="findings-count"></span>
        </label>
        <span class="spacer"></span>
        <span id="viewed-count" class="dim" title="Files marked viewed (v)"></span>
        <div id="viewed-progress" class="viewed-progress" aria-hidden="true"><div id="viewed-bar"></div></div>
      </div>
      <ul id="file-list"></ul>
      <div class="resizer" data-resize="side" title="Drag to resize, double-click to reset"></div>
    </nav>

    <main id="main">
      <section id="summary-card" class="summary-card" aria-label="PR summary" hidden></section>
      <section id="flows-card" class="summary-card flows-card" aria-label="Flows" hidden></section>
      <div id="sections"></div>
    </main>

    <aside id="chat-drawer" class="drawer" aria-label="Chat" hidden>
      <div class="resizer" data-resize="drawer" title="Drag to resize, double-click to reset"></div>
      <div class="drawer-head">
        <h2>Chat</h2>
        <span class="spacer"></span>
        <button id="chat-new" class="btn small" type="button" title="Ask about the whole pull request">New question</button>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div id="thread-list" class="thread-list"></div>
      <div class="convo">
        <div id="convo-head" class="convo-head"></div>
        <div id="messages" class="messages"></div>
        <div class="chat-compose">
          <textarea id="chat-input" rows="3" placeholder="Ask about this code…"></textarea>
          <div class="compose-row">
            <span id="chat-hint" class="hint"></span>
            <span class="spacer"></span>
            <button id="chat-send" class="btn primary small" type="button">Send</button>
          </div>
        </div>
      </div>
    </aside>

    <aside id="review-drawer" class="drawer" aria-label="Submit review" hidden>
      <div class="resizer" data-resize="drawer" title="Drag to resize, double-click to reset"></div>
      <div class="drawer-head">
        <h2>Submit review</h2>
        <span class="spacer"></span>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div id="review-body" class="drawer-body"></div>
    </aside>

    <aside id="findings-drawer" class="drawer" aria-label="LLM findings" hidden>
      <div class="resizer" data-resize="drawer" title="Drag to resize, double-click to reset"></div>
      <div class="drawer-head">
        <h2>LLM findings</h2>
        <span class="spacer"></span>
        <button class="icon-btn" type="button" data-close aria-label="Close">×</button>
      </div>
      <div id="findings-body" class="drawer-body"></div>
    </aside>
  </div>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-box" role="dialog" aria-label="File viewer">
      <div id="viewer-head" class="viewer-head"></div>
      <div id="viewer-scroll" class="viewer-scroll"></div>
    </div>
  </div>

  <div id="walk-bar" class="walk-bar" role="toolbar" aria-label="Flow walkthrough" hidden></div>

  <div id="toasts" aria-live="polite"></div>

  <script src="/vendor/highlight.js"></script>
  <script src="/app.js"></script>
</body>
</html>
